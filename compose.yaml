services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${LEGION_DB_ROOT_PASSWORD:?set LEGION_DB_ROOT_PASSWORD in .env}
      MYSQL_USER: legion
      MYSQL_PASSWORD: ${LEGION_DB_PASSWORD:?set LEGION_DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=256M
    ports:
      - "127.0.0.1:${LEGION_DB_PORT:-3310}:3306"
    volumes:
      - ${LEGION_RUNTIME_ROOT:?set LEGION_RUNTIME_ROOT in .env}/mysql:/var/lib/mysql
      - ${LEGION_RUNTIME_ROOT:?set LEGION_RUNTIME_ROOT in .env}/database-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  bnetserver:
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    command: ["bin/bnetserver", "-c", "/opt/legion/config/bnetserver.conf"]
    ports:
      - "1119:1119"
    volumes:
      - ${LEGION_RUNTIME_ROOT:?set LEGION_RUNTIME_ROOT in .env}/server:/opt/legion/server:ro
      - ${LEGION_RUNTIME_ROOT:?set LEGION_RUNTIME_ROOT in .env}/config:/opt/legion/config:ro
    restart: unless-stopped

  worldserver:
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      bnetserver:
        condition: service_started
    command: ["bin/worldserver", "-c", "/opt/legion/config/worldserver.conf"]
    ports:
      - "8085:8085"
    stdin_open: true
    tty: true
    volumes:
      - ${LEGION_RUNTIME_ROOT:?set LEGION_RUNTIME_ROOT in .env}/server:/opt/legion/server:ro
      - ${LEGION_RUNTIME_ROOT:?set LEGION_RUNTIME_ROOT in .env}/config:/opt/legion/config:ro
      - ${LEGION_DATA_ROOT:?set LEGION_DATA_ROOT in .env}:/opt/legion/data:ro
      - ${LEGION_RUNTIME_ROOT:?set LEGION_RUNTIME_ROOT in .env}/logs:/opt/legion/logs
    restart: unless-stopped
